<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analizador</title>
    <!-- Boostrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>

    <!-- Script para usar libreria para alertas -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="sweetalert2.all.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .custom-container-fluid {
        padding: 0;
        margin: 0;
        }
        
        .custom-row {
          margin: 0;
        }
  
        .custom-col {
          padding: 0;
        }
    </style>
    
</head>
<body>

    <div class="container-fluid custom-container-fluid">
        <div class="row custom-row">
          <div class="col custom-col">
           
            <div class="centrar gradiente px-20 py-6 border-b" style="color: white; font-size: xx-large; font-family: Arial, Helvetica, sans-serif;">
                <p>Seleccione la conversación</p>
            </div>
        
            <div style="text-align: center;margin-top: 20px;">
                <br>
                
                <div class="mb-3" style="margin-left: 60px;margin-right: 60px;">
                    <div class="form-group">
                        <label class="form-label" style="font-family: Arial, Helvetica, sans-serif; font-size: x-large;">Cargar chat</label>
                        <input id="Archivo_txt" class="form-control" type="file" id="formFile">
                    </div>
                </div>
        
                <div class="mb-3" style="margin-left: 60px;margin-right: 60px;">
                    <label for="exampleFormControlTextarea1" class="form-label" style="font-family: Arial, Helvetica, sans-serif; font-size: x-large;">Contenido</label>
                    <textarea id="TextArea_Contenido" cols="30" rows="20" class="form-control" id="exampleFormControlTextarea1" rows="3" readonly="readonly"></textarea>
                </div>
        
                <button id="Button_GJ" type="button" class="btn btn-outline-primary btn-lg">Guardar en formato JSON</button>
                <br>
        
                <a href="../Visualizador/visualizador.html" class="btn btn-outline-primary btn-lg" style="margin-top: 40px;">Abrir Visualizador</a>
                
            </div>

          </div>
        </div>
      </div>


<script src="../Analizador/analizador.js"></script>
</body>
</html>
